name: Import Harbor Run source and history
'on':
  push:
    branches: [main]
    paths: [.github/workflows/harbor-run-import.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harbor-run-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Import complete source with original commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_HEAD: 4ea7b7023be3499a3d45e9955cc67417379281ae
          SOURCE_TREE: 3b45efb991d415d8434a464104a08f11e3ac689f
          BUNDLE_SHA256: 065adbc27d96806682d9d18d4ae40efe77c8b8702ff32d4b9dd471a51a871003
          PART_COUNT: '10'
          BUNDLE_PREFIX: https://harbor-run-racer.calmechoes3.chatgpt.site/git-transfer-065adbc27d96
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/harbor-run-import"
          cd "$RUNNER_TEMP/harbor-run-import"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --unset-all http.https://github.com/.extraheader || true' EXIT
          git remote add origin https://github.com/Talha12Shiekh/harbor-run-3d-racer.git
          git fetch --quiet origin main
          remote_head=$(git rev-parse FETCH_HEAD)
          test "$remote_head" = "$EXPECTED_HEAD"
          mkdir parts
          ready=false
          for attempt in $(seq 1 120); do
            if curl --fail --silent "$BUNDLE_PREFIX/part-000" -o parts/part-000; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          for ((i=1; i<PART_COUNT; i++)); do
            printf -v part 'part-%03d' "$i"
            curl --fail --silent --show-error --retry 3 --retry-all-errors "$BUNDLE_PREFIX/$part" -o "parts/$part"
          done
          cat parts/part-* > source.bundle
          printf '%s  source.bundle\n' "$BUNDLE_SHA256" | sha256sum --check
          git bundle verify source.bundle
          git fetch --quiet source.bundle refs/heads/main:refs/heads/imported-source
          test "$(git rev-parse imported-source)" = "$SOURCE_HEAD"
          test "$(git rev-parse imported-source^{tree})" = "$SOURCE_TREE"
          test "$(git rev-list --count imported-source)" = 12
          git config user.name 'Harbor Run source import'
          git config user.email 'source-import@users.noreply.github.com'
          import_commit=$(printf 'Import complete Harbor Run source and original development history\n\nSource-Commit: %s\n' "$SOURCE_HEAD" | git commit-tree "$SOURCE_TREE" -p "$remote_head" -p "$SOURCE_HEAD")
          git push origin "$import_commit:refs/heads/main"
          echo "Imported source commit $SOURCE_HEAD with all 12 original commits."
